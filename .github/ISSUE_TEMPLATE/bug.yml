name: Report a bug
description: Something does not work as expected.
labels: ["fehler"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please do not include credentials, server
        addresses or account names; this issue is public. Report security
        issues as described in SECURITY.md.
  - type: textarea
    id: beobachtung
    attributes:
      label: What happened
      description: What did you observe?
    validations:
      required: true
  - type: textarea
    id: erwartung
    attributes:
      label: What you expected
      description: What did you expect instead?
    validations:
      required: true
  - type: textarea
    id: schritte
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. …
        2. …
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: SGRM version
      placeholder: "e.g. 1.3.0 or image tag"
    validations:
      required: true
  - type: input
    id: geraet
    attributes:
      label: Environment
      placeholder: "e.g. Docker 28 on Debian 13, Firefox 145"
