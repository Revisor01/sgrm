name: Fehler melden
description: Etwas funktioniert nicht wie erwartet.
labels: ["fehler"]
body:
  - type: markdown
    attributes:
      value: |
        Danke für die Meldung. Bitte keine Zugangsdaten, Server-Adressen oder
        Kontonamen eintragen; dieses Issue ist öffentlich. Sicherheitslücken
        bitte über den Weg in SECURITY.md melden.
  - type: textarea
    id: beobachtung
    attributes:
      label: Beobachtung
      description: Was ist passiert?
    validations:
      required: true
  - type: textarea
    id: erwartung
    attributes:
      label: Erwartung
      description: Was hättest du stattdessen erwartet?
    validations:
      required: true
  - type: textarea
    id: schritte
    attributes:
      label: Schritte zum Nachvollziehen
      placeholder: |
        1. …
        2. …
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version von SGRM
      placeholder: "z. B. 1.3.0 oder Image-Tag"
    validations:
      required: true
  - type: input
    id: geraet
    attributes:
      label: Umgebung
      placeholder: "z. B. Docker 28 auf Debian 13, Browser Firefox 145"
