name: Docker Build & Push

on:
  push:
    branches:
      - 'main'
    tags:
      - 'v*'
  pull_request:
    branches:
      - 'main'
  workflow_dispatch:
    inputs:
      deploy_to_portainer:
        description: 'Deploy to Portainer after build'
        type: boolean
        default: true
      image_tag:
        description: 'Custom image tag (leer lassen für latest)'
        type: string
        required: false
        default: ''

permissions:
  contents: read

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set custom tag if provided
        if: github.event_name == 'workflow_dispatch' && inputs.image_tag != ''
        env:
          IMAGE_TAG_INPUT: ${{ inputs.image_tag }}
        run: |
          # Nur gültige Docker-Tag-Zeichen zulassen
          if [[ ! "$IMAGE_TAG_INPUT" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo "::error::Ungültiges Image-Tag: $IMAGE_TAG_INPUT"
            exit 1
          fi
          echo "CUSTOM_TAG=$IMAGE_TAG_INPUT" >> "$GITHUB_ENV"

      - name: Set Docker tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: revisoren/sgrm
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ env.CUSTOM_TAG }},enable=${{ env.CUSTOM_TAG != '' }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # PRs (z. B. von Dependabot) haben keinen Zugriff auf Secrets und
      # pushen ohnehin nicht – dort nur bauen.
      - name: Login to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          username: revisoren
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push to Docker Hub
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Push to Portainer
        if: github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.deploy_to_portainer)
        env:
          PORTAINER_WEBHOOK_URL: ${{ secrets.PORTAINER_WEBHOOK_URL }}
        run: |
          # Bestimme das Tag für den Portainer-Webhook
          IMAGE_TAG="${CUSTOM_TAG:-latest}"

          # Rufe den Portainer-Webhook auf (-f: HTTP-Fehler lassen den Job fehlschlagen)
          curl -fsS -X POST "$PORTAINER_WEBHOOK_URL" -H "Content-Type: application/json" \
            -d "{\"repository\":\"revisoren/sgrm:${IMAGE_TAG}\"}"

          echo "Deployed revisoren/sgrm:${IMAGE_TAG} to Portainer"