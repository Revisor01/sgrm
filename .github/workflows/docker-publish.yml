name: Docker Build & Push

on:
  push:
    branches:
      - 'main'
    tags:
      - 'v*'
  pull_request:
    branches:
      - 'main'
  workflow_dispatch:
    inputs:
      deploy_to_portainer:
        description: 'Deploy to Portainer after build'
        type: boolean
        default: true
      image_tag:
        description: 'Custom image tag (leer lassen für latest)'
        type: string
        required: false
        default: ''

permissions:
  contents: read

jobs:
  image:
    uses: Revisor01/workflows/.github/workflows/docker-image.yml@5bb9fc1d9e2cd728029f334f50bbe355f005eef5 # 1.3.1
    permissions:
      contents: read
      packages: write
    with:
      image: ghcr.io/revisor01/sgrm
      tags: |
        type=semver,pattern={{version}}
        type=semver,pattern={{major}}.{{minor}}
        type=raw,value=latest,enable={{is_default_branch}}
        type=raw,value=${{ inputs.image_tag }},enable=${{ github.event_name == 'workflow_dispatch' && inputs.image_tag != '' }}
      # Startet das Image wie ein Update von einer Version, die noch als root
      # lief, und prüft Rechte, Endpunkte und ein schnelles Beenden.
      pruefung: |
        mkdir -p smoke/config smoke/data
        echo '{}' | sudo tee smoke/data/releases.json > /dev/null
        sudo chown -R root:root smoke

        docker run -d --name sgrm-smoke -p 8080:8080 \
          -e SGRM_ADMIN_PASSWORD=smoke-test \
          -v "$PWD/smoke/config:/app/config" -v "$PWD/smoke/data:/app/data" "$PRUEFLING"

        for i in $(seq 1 30); do
          curl -fsS http://localhost:8080/health && break
          sleep 1
        done
        curl -fsS http://localhost:8080/health
        curl -fsS http://localhost:8080/releases > /dev/null
        curl -fsS http://localhost:8080/api/releases

        docker top sgrm-smoke -eo pid,uid,args
        if docker top sgrm-smoke -eo pid,uid,args | awk 'NR > 1 && $2 == 0' | grep -q .; then
          echo "::error::Prozesse laufen als root"
          exit 1
        fi
        test "$(sudo stat -c %u smoke/config/config.yaml)" = 1000
        test "$(sudo stat -c %u smoke/data/releases.json)" = 1000

        # docker stop muss ohne 10-s-Timeout (SIGKILL) durchgehen
        start=$(date +%s)
        docker stop sgrm-smoke
        test $(( $(date +%s) - start )) -lt 8
        docker logs sgrm-smoke

  deploy:
    needs: image
    if: github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.deploy_to_portainer)
    uses: Revisor01/workflows/.github/workflows/portainer-deploy.yml@5bb9fc1d9e2cd728029f334f50bbe355f005eef5 # 1.3.1
    secrets:
      webhook: ${{ secrets.PORTAINER_WEBHOOK_URL }}
